# Runs the tests on every push and builds the installer for version tags (v*). Written without being able to run it
# here: check the first run, in particular the Inno Setup install step.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover tests
      - run: python main.py --selftest
        env: { QT_QPA_PLATFORM: offscreen }
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y --no-progress
      - run: .\build.bat
        shell: cmd
      - run: .\make_portable.bat
        shell: cmd
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LavatiNoter-Setup.exe
            dist/LavatiNoter-portable.zip
            dist/SHA256SUMS.txt
